# CI — runs on every PR (and push to develop/main). Gates merges.
# Playwright E2E + production deploy live in deploy.yml (on merge to `develop`).
# See PLANS.md §15.
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Least privilege — this workflow only checks out, builds, and tests.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Production origin — needed by `astro build` for sitemap/canonical URLs.
  PUBLIC_SITE_URL: https://hydroflare.workers.dev

jobs:
  ci:
    name: check · codegen · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect Shopify secrets
        # The codegen-drift step introspects the live Storefront endpoint, which
        # needs the token. Until secrets are configured the step is skipped, so
        # this skeleton stays green on a trivial PR. (PLANS.md §18 AC.)
        id: shopify
        env:
          DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_PUBLIC_TOKEN }}
        run: echo "has_secrets=${{ env.DOMAIN != '' && env.TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      # Type gate — must be clean (PLANS.md §19).
      - name: astro check
        run: npm run check

      # Codegen drift — fails if a query changed but generated types weren't
      # regenerated and committed (PLANS.md §5). Active once secrets exist.
      - name: Codegen drift
        if: steps.shopify.outputs.has_secrets == 'true'
        env:
          SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
          SHOPIFY_STOREFRONT_PUBLIC_TOKEN: ${{ secrets.SHOPIFY_STOREFRONT_PUBLIC_TOKEN }}
        run: |
          npm run codegen
          git diff --exit-code -- src/lib/shopify/generated/

      # Unit/component tests (PLANS.md §8).
      - name: Vitest
        run: npm run test

      # Build must succeed with the Cloudflare adapter (PLANS.md §19).
      - name: Build
        run: npm run build

      # TODO (Phase 15): per-PR preview Worker deploy via `wrangler deploy --env
      # preview`, gated on CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID, posting
      # the preview URL to the PR. Requires the preview env wrangler config.
